name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  android-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile library and demo
        run: |
          ./gradlew \
            :horizon-bloom:compileAndroidMain \
            :demo:compileAndroidMain \
            :horizon-bloom:compileKotlinDesktop \
            :demo:compileKotlinDesktop \
            :demo-android:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile library and demo
        run: |
          ./gradlew \
            :horizon-bloom:compileKotlinIosArm64 \
            :horizon-bloom:compileKotlinIosSimulatorArm64 \
            :demo:compileKotlinIosArm64 \
            :demo:compileKotlinIosSimulatorArm64
      - name: Build iOS demo app
        run: |
          xcodebuild \
            -project iosApp/HorizonBloomDemo.xcodeproj \
            -scheme HorizonBloomDemo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
