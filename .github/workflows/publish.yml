name: Prepare Maven Central Deployment

# No automatic release trigger: only an explicit manual dispatch can upload artifacts.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version matching a tag (for example, 0.1.0)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  upload:
    name: Upload signed multiplatform artifacts
    runs-on: macos-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify the release tag and license
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git describe --tags --exact-match)" == "v$RELEASE_VERSION" ]]
          test -s LICENSE
      - name: Upload to Maven Central Portal (manual release required)
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_POM_DEVELOPER_EMAIL: ${{ vars.MAVEN_POM_DEVELOPER_EMAIL }}
        shell: bash
        run: |
          for name in ORG_GRADLE_PROJECT_mavenCentralUsername \
                      ORG_GRADLE_PROJECT_mavenCentralPassword \
                      ORG_GRADLE_PROJECT_signingInMemoryKey \
                      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword \
                      ORG_GRADLE_PROJECT_POM_DEVELOPER_EMAIL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing publishing credential: $name"
              exit 1
            fi
          done
          ./gradlew \
            :horizon-bloom:publishToMavenCentral \
            :demo:publishToMavenCentral \
            "-PRELEASE_VERSION=$RELEASE_VERSION"
